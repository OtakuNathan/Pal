[project]
name = "pal-v2"
version = "0.1.0"
description = "Independent Pal Architecture V1/V2 rebuild lane"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=47.0,<48",
    "croniter>=1.3,<2",
    "litellm>=1.83,<2",
    "pillow>=10.0,<12",
    "pymupdf>=1.24,<2",
    "msgpack>=1.0,<2",
    "peewee>=3.17,<4",
    "playwright>=1.48,<2",
    "python-telegram-bot>=20.7,<22",
    "sentence-transformers>=3.0,<4",
    "sqlite-vec>=0.1.6,<1",
    "telegramify-markdown>=0.4,<1",
]

[project.scripts]
pal = "pal.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pal.minion" = ["profile_templates/*.toml", "profile_templates/**/*.toml"]
"pal.plugins_builtin.mcp" = ["plugin.toml"]
"pal.plugins_builtin.minion" = ["plugin.toml"]
"pal.plugins_builtin.sqlite_vec_l3" = ["plugin.toml"]
"pal.plugins_builtin.web_fetch" = ["plugin.toml"]
"pal.plugins_builtin.web_search" = ["plugin.toml"]
