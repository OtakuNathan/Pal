[project]
name = "pal-v2"
version = "0.1.0"
description = "Independent Pal Architecture V1/V2 rebuild lane"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=47.0,<48",
    "croniter>=1.3,<2",
    "jieba>=0.42,<1",
    "openai>=2,<3",
    "anthropic>=0.49,<1",
    "pillow>=10.0,<12",
    "pymupdf>=1.24,<2",
    "msgpack>=1.0,<2",
    "peewee>=3.17,<4",
    "playwright>=1.48,<2",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.23,<5",
    "jinja2>=3.1,<4",
    "prompt-toolkit>=3.0.52,<4",
    "python-telegram-bot>=20.7,<22",
    "rich>=13,<15",
    "sqlite-vec>=0.1.6,<1",
    "telegramify-markdown>=1.2,<2",
    "websockets>=13,<15",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.0,<4",
]
test = [
    "hypothesis>=6.100,<7",
    "hypothesis-jsonschema>=0.23,<1",
]

[project.scripts]
pal = "pal.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pal.lsp" = ["server_templates/*.toml"]
"pal.mcp" = ["templates/*.toml"]
"pal.bunshin" = [
    "architecture_templates/**/*.json",
    "architecture_templates/**/*.j2",
    "architecture_specializations/**/*.json",
    "architecture_specializations/**/*.j2",
    "family_templates/*.toml",
    "profile_templates/*.toml",
    "profile_templates/**/*.toml",
]
"pal.plugins_builtin.lsp" = ["plugin.toml"]
"pal.plugins_builtin.mcp" = ["plugin.toml"]
"pal.plugins_builtin.bunshin" = ["plugin.toml"]
"pal.plugins_builtin.sqlite_vec_l3" = ["plugin.toml"]
"pal.plugins_builtin.web_fetch" = ["plugin.toml"]
"pal.plugins_builtin.web_search" = ["plugin.toml"]
