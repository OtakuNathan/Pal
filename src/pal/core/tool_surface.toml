# Tool Surface Configuration
# Controls which capabilities are exposed to the LLM as function-calling tools.
# Other capabilities remain discoverable via op_tool_search
# and invocable via op_tool_call.

[singletons]
# These capabilities have target_id = SINGLETON_TARGET and are always exposed.
capabilities = [
    # -- execution (discovery + exec) --
    "op_tool_read",
    "op_tool_search",
    "op_exec_shell",
    "op_file_read",
    "op_file_edit",
    "op_file_write",
    "op_path_delete",
    "op_tool_call",
    "op_tool_result_page",
    # -- behavior (affordance + skill) --
    "op_behavior_advise",
    "op_behavior_save",
    "op_behavior_affordance_update",
    "op_behavior_affordance_delete",
    # -- memory (active provider) --
    "op_memory_recall",
    "op_memory_write",
    "op_memory_update",
    "op_memory_delete",
    # -- artifacts (conversation attachments) --
    # Discover via op_tool_search when attachments/artifacts are relevant:
    # "op_artifact_list",
    # "op_artifact_search",
    # "op_artifact_info",
    # "op_artifact_read",
    # -- channel output --
    "op_channel_send_attachment",
    # -- web --
    "op_web_search",
    "op_web_read",
    # -- checklist (in-memory scratchpad for Pal's own multi-step work) --
    # Only the entry point is resident; check/show/clear stay discoverable
    # via op_tool_search and invocable via op_tool_call.
    "op_checklist_upsert",
    # -- LSP (workspace preparation is the only resident entry point) --
    # Navigation, symbols, hierarchy, diagnostics, and repair operations stay
    # indirect; prepare_workspace tells the model which family to use next.
    "op_lsp_prepare_workspace",
]

# Dynamic capabilities: resolved at runtime by following active provider-like settings.
