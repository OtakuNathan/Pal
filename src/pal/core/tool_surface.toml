# Tool Surface Configuration
# Controls which capabilities are exposed to the LLM as function-calling tools.
# Other capabilities remain discoverable via op_tool_search
# and invocable via op_tool_call.

[singletons]
# These capabilities have target_id = SINGLETON_TARGET and are always exposed.
capabilities = [
    # -- execution (discovery + exec) --
    "op_tool_read",
    "op_tool_search",
    "op_exec_shell",
    "op_file_read",
    "op_file_edit",
    "op_file_write",
    "op_file_state",
    "op_tool_call",
    # -- behavior (affordance + skill) --
    "op_behavior_advise",
    "op_behavior_save",
    # -- memory (active provider) --
    "op_memory_recall",
    "op_memory_write",
    "op_memory_update",
    "op_memory_delete",
    # -- artifacts (conversation attachments) --
    "op_artifact_info",
    "op_artifact_read",
    # -- channel output --
    # Discover via op_tool_search when needed:
    # "op_channel_send_attachment",
    # -- web --
    "op_web_search",
    "op_web_read",
]

# Dynamic capabilities: resolved at runtime by following active provider-like settings.
