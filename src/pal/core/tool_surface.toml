# Tool Surface Configuration
# Controls which capabilities are exposed to the LLM as function-calling tools.
# Other capabilities remain discoverable via op_exec_disc_search
# and invocable via op_exec_capability_call.

[singletons]
# These capabilities have target_id = SINGLETON_TARGET and are always exposed.
capabilities = [
    # -- execution (discovery + exec) --
    "op_exec_disc_read",
    "op_exec_disc_search",
    "op_exec_run",
    "op_exec_capability_call",
    # -- behavior (affordance + skill) --
    "op_behavior_advise",
    "op_behavior_affordance_submit",
    "op_skill_inject",
    # -- web --
    "op_web_search_query",
    "op_web_fetch_read",
]

# Dynamic capabilities: resolved at runtime by following the active provider.
[[dynamic]]
canonical_path = "op_l3_recall_query"
provider_setting = "memory"

[[dynamic]]
canonical_path = "op_l3_commit_write"
provider_setting = "memory"

[[dynamic]]
canonical_path = "op_l3_correct_patch"
provider_setting = "memory"
