# Tool Surface Configuration
# Controls which capabilities are exposed to the LLM as function-calling tools.
# Other capabilities remain discoverable via operation_execution_discovery_search
# and invocable via operation_execution_capability_call.

[singletons]
# These capabilities have target_id = SINGLETON_TARGET and are always exposed.
capabilities = [
    # -- execution (discovery + exec) --
    "operation_execution_discovery_read",
    "operation_execution_discovery_search",
    "operation_execution_exec_run",
    "operation_execution_capability_call",
    # -- web --
    "operation_web_search_query",
    "operation_web_fetch_read",
]

# Dynamic capabilities: resolved at runtime by following the active provider.
[[dynamic]]
canonical_path = "operation_l3_recall_query"
provider_setting = "memory"

[[dynamic]]
canonical_path = "operation_l3_commit_write"
provider_setting = "memory"

[[dynamic]]
canonical_path = "operation_l3_correct_patch"
provider_setting = "memory"
