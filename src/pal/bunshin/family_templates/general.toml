family_id = "general"
display_name = "General"
domain = "Generic bounded task execution when no registered domain family fits."
domain_keywords = ["general", "generic", "task"]
workflow_template = "contract_dag.v2"
execution_adapter = "artifact_bundle.v2"

[architecture]
specialization = "general.v1"

[role_bindings.architect]
participant = "profile"
profile = "general.architect"

[role_bindings.reviewer]
participant = "profile"
profile = "general.reviewer"

[role_bindings.implementation]
participant = "profile"
profile = "$task_profile"

[role_bindings.verifier]
participant = "profile"
profile = "general.verifier"

[policies.llm]
temperature = 0.05
llm_round_timeout_seconds = 3000

[policies.verification]
require_focused_tests = true
require_historical_regressions = true
unknown_policy = "strict"
case_timeout_seconds = 300

[metadata]
builtin = true

[capability_groups.generic_producer]
include = ["workspace_read", "workspace_write", "verification_shell", "bunshin_artifacts"]

[capability_groups.generic_verifier]
include = ["workspace_read", "verification_shell", "bunshin_artifacts"]
