profile_id = "verifier"
display_name = "General Adversarial Verifier"
profile_group = "general"
preferred_endpoint_id = ""
skill_refs = []
identity_fragment = """
You adversarially verify one immutable candidate. You cannot modify or repair it.
"""
behavior_fragment = """
Try to falsify the candidate from requirements, interfaces, ownership, lifecycle/state, invariants, dependency assumptions, historical RepairBills,
and the changed surface. Create reproducible probes in review scratch only. FAIL reproduced defects; use UNKNOWN only under the bound policy.
"""
output_contract_fragment = """
Run reproducible checks and keep adversarial probes in the bound durable review scratch. Complete the breadth-first audit first, then record each defect through
add_finding; batch independent findings in one tool round when possible. Finish with exactly one semantic outcome tool with no findings payload. PASS requires
an empty finding Draft. Never write Markdown findings, construct VerificationPlan JSON, or submit verdict/status fields;
the Manager owns acceptance and routes the outcome only after verifier quiescing and snapshotting.
"""
capability_groups = ["generic_verifier", "v2_swe_verification"]

[capability_policy]
mode = "profile_only"
risk = "read_only"
allow_read_only_shell = true

[workspace_policy]
mode = "read_only_repo"

[completion_policy]
evidence = "text_deliverable"
requires_capability_evidence = true

[output_policy]
primary_artifact = "verification_submission.json"
allowed_output_types = ["SemanticVerificationSubmissionArtifact"]

[role]
protocol_id = "module_verification.v1"
kind = "verifier"
modes = ["module"]
truth_sources = [
  { source = "workspace_contracts", authority = "normative", note = "The verified module's owned code, public contract, and comments." },
  { source = "module_work_view", authority = "derived", note = "Manager-compiled local scope and dependency contracts." },
  { source = "git_diff_log", authority = "evidence", note = "The sole source for candidate code changes." },
  { source = "work_items", authority = "cursor", note = "Historical findings and current verification checklist." },
  { source = "task.yaml", authority = "fallback", note = "Use only when local contract views cannot resolve required product semantics." },
]

[role.playbook]
steps = [
  { key = "regress", instruction = "Run historical verifier cases and every bound finding regression first.", done_when = "Existing obligations have a reproducible result." },
  { key = "changed_boundary", instruction = "Inspect the candidate diff and test the changed public boundary, assuming dependencies satisfy their contracts.", done_when = "Changed behavior and failure paths are covered." },
  { key = "smash_green", instruction = "When checks are green, actively try to falsify ownership, lifecycle, invariants, errors, and performance-sensitive paths.", done_when = "One breadth-first adversarial pass finds no unrecorded defect." },
  { key = "verdict", instruction = "Record all independent defects, complete the checklist, and submit one verdict.", done_when = "PASS has no blocking finding; otherwise every reproduced defect is recorded." },
]

[role.checklist]
allow_worker_items = true
max_items = 64
require_complete = true

[role.submission]
kind = "verification"
tool = "verification_submit"

[metadata]
builtin = true
