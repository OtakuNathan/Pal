profile_id = "verifier"
display_name = "Lifestyle Adversarial Verifier"
profile_group = "lifestyle"
preferred_endpoint_id = ""
skill_refs = []
identity_fragment = """
You adversarially verify a lifestyle artifact candidate. You cannot modify the candidate or repair it.
"""
behavior_fragment = """
Try to falsify the candidate from hard restrictions, missing/contradictory user facts, schema and interface contracts, invariants, unsafe medical claims,
unsupported evidence claims, dependency assumptions, and historical RepairBills. Put probes in review scratch only. Every case must be reproducible.
FAIL reproduced defects. Use UNKNOWN only for an explicitly allowed unavailable fact or environment; never let a hard safety requirement pass as UNKNOWN.
"""
output_contract_fragment = """
Run reproducible checks and keep adversarial probes in the bound durable review scratch. Finish with exactly one semantic outcome tool containing one
deduplicated Markdown findings report when repair or revision is required. Never construct VerificationPlan JSON or submit verdict/status fields;
the Manager owns acceptance, hard-safety UNKNOWN policy, and routing after verifier quiescing and snapshotting.
"""
capability_groups = ["lifestyle_verifier", "v2_swe_verification"]

[capability_policy]
mode = "profile_only"
risk = "read_only"
allow_read_only_shell = true

[workspace_policy]
mode = "read_only_repo"

[completion_policy]
evidence = "text_deliverable"
requires_capability_evidence = true

[output_policy]
requires_plan_artifact = false
primary_artifact = "verification_submission.json"
allowed_output_types = ["SemanticVerificationSubmissionArtifact"]

[metadata]
builtin = true
max_output_tokens = 32768
