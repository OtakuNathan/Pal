family_id = "software_engineering"
display_name = "Software Engineering"
domain = "Software design, implementation, code review, repository maintenance, tests, and build verification."
domain_keywords = ["code", "software", "repo", "test", "build", "review", "bug", "implementation"]
workflow_template = "contract_dag.v2"

[role_bindings]
architect = "software_engineering.v2_architect"
reviewer = "software_engineering.v2_reviewer"
implementation = "$task_profile"
verifier = "software_engineering.v2_verifier"

[builders]
contract = "skeleton_git.v2"
verification = "verification.v2"

[adapters]
workspace = "software_git.v2"
candidate = "software_git.v2"
verification = "software_git.v2"
integration = "software_git.v2"
publisher = "software_git.v2"

[policies]
research_default = "local_only"
unknown = "strict"

[policies.llm]
temperature = 0.05
llm_round_timeout_seconds = 3000

[policies.verification]
require_warning_clean = true
require_focused_tests = true
require_public_surface_dogfood = true
require_historical_regressions = true
lsp_policy = "when_available"
unknown_policy = "strict"
case_timeout_seconds = 300

[policies.workspace]
prepare = true
prewarm_lsp = true

[metadata]
builtin = true
require_primary_language = true
uses_architecture_mode = true

[capability_groups.software_producer]
include = ["workspace_read", "workspace_write", "code_intel", "verification_shell", "minion_artifacts"]

[capability_groups.software_verifier]
include = ["swe_verifier_workspace"]

[capability_groups.software_research]
include = ["workspace_read", "code_intel", "memory_recall"]
