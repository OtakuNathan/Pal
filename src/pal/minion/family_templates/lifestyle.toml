family_id = "lifestyle"
display_name = "Lifestyle"
domain = "Nutrition, diet, meal planning, training, recovery, sleep, and personal health coaching tasks."
domain_keywords = ["nutrition", "diet", "meal", "training", "fitness", "weight", "sleep", "recovery", "health"]
workflow_template = "contract_dag.v2"

[role_bindings]
architect = "$task_profile"
reviewer = "$task_profile"
implementation = "$task_profile"
verifier = "$task_profile"

[builders]
contract = "contract_sketch.v2"
verification = "verification.v2"

[adapters]
workspace = "artifact_bundle.v2"
candidate = "artifact_bundle.v2"
verification = "artifact_bundle.v2"
integration = "artifact_bundle.v2"
publisher = "artifact_bundle.v2"

[policies]
research_default = "local_only"
unknown = "strict"
health_boundary = "non_medical"

[policies.llm]
temperature = 0.05
llm_round_timeout_seconds = 3000

[policies.verification]
require_focused_tests = true
require_historical_regressions = true
require_public_surface_dogfood = true
unknown_policy = "strict"
case_timeout_seconds = 300

[metadata]
builtin = true

[capability_groups.lifestyle_producer]
include = ["workspace_read", "workspace_write", "verification_shell", "minion_artifacts"]

[capability_groups.lifestyle_verifier]
include = ["workspace_read", "verification_shell", "minion_artifacts"]
