preparer_id = "clangd"
kind = "lsp"
language_ids = ["c", "cpp", "objc", "objcpp"]
required_lsp_server_ids = ["clangd"]
server_ids = ["clangd"]
readonly_skip = "repo already existed; did not create baseline clangd config"

[[files]]
path = ".clangd"
skip_if_exists = [".clangd", "compile_commands.json"]
content = """
# Generated by Pal minion workspace setup for clangd.
CompileFlags:
  Add: [-std=${clangd_standard}]
"""
