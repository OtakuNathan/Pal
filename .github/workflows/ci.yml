name: test

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Domain contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Pal and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check migrated contracts
        run: python -m mypy --config-file mypy-contracts.ini
      - name: Check architecture boundaries
        run: python -m pytest -q tests/test_import_boundaries.py tests/test_port_contracts.py tests/test_dynamic_access.py tests/test_bunshin_ownership.py
      - name: Check formal inventory and generated implementation models
        run: python scripts/run_tlc.py --inventory-only

  pytest:
    name: ${{ matrix.os }} / ${{ matrix.batch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        batch: [core-a, core-b, bunshin-a, bunshin-b]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Pal and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Install shell test dependencies
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi

      - name: Run test batch
        run: python scripts/run_test_batch.py ${{ matrix.batch }}
