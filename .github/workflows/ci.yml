name: test

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Domain contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Pal and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check migrated contracts
        run: python -m mypy --config-file mypy-contracts.ini
      - name: Check architecture boundaries
        run: python -m pytest -q tests/test_import_boundaries.py tests/test_port_contracts.py tests/test_dynamic_access.py tests/test_bunshin_ownership.py
      - name: Check formal inventory and generated implementation models
        run: python scripts/run_tlc.py --inventory-only

  pytest:
    name: ${{ matrix.os }} / ${{ matrix.batch }}
    runs-on: ${{ matrix.os }}
    needs: contracts
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest]
        batch: [core-a, core-b, bunshin-a, bunshin-b]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Pal and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Install shell test dependencies
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi

      - name: Run test batch
        run: |
          mkdir -p test-logs/pytest
          python scripts/run_test_batch.py '${{ matrix.batch }}' \
            -ra --tb=short --durations=15 \
            --junitxml=test-logs/pytest/results.xml \
            2>&1 | tee test-logs/pytest/pytest.log

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.batch }}
          path: test-logs/pytest
          retention-days: 14
          if-no-files-found: warn

  models:
    name: TLC / ${{ matrix.group }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [core, memory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install model renderer dependencies
        run: python -m pip install -e '.[test]'
      - name: Fetch checksum-pinned TLC
        run: python scripts/run_tlc.py --fetch-only --jar "$RUNNER_TEMP/tla2tools.jar"
      - name: Check models and generated implementation relations
        run: >-
          python scripts/run_tlc.py --jar "$RUNNER_TEMP/tla2tools.jar"
          --group '${{ matrix.group }}' --heap 1g --workers 1 --timeout 1800
          --output test-logs/tlc
      - name: Preserve model results and counterexamples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tlc-${{ matrix.group }}
          path: test-logs/tlc
          retention-days: 14
          if-no-files-found: warn
