name: native shell runtime

on:
  pull_request:
    paths:
      - "native/shell_runtime/**"
      - "src/pal/execution/**"
      - "src/pal/core/turn_executor.py"
      - "src/pal/bootstrap/service.py"
      - "src/pal/runtime_app.py"
      - "src/pal/bunshin/**"
      - ".github/workflows/native-shell-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-shell:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/pal-shell-native
          ref: e66d526acc8ce315572eb225d4abc9817384e828
          path: .native-backend
      - name: Install Pal and independently packaged backend
        run: python -m pip install -e '.[test]' ./.native-backend
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - name: Exercise native lifecycle and Pal hosts
        run: python -m unittest discover -s native/shell_runtime/tests -v
        env:
          PYTHONPATH: native/shell_runtime/python:src
